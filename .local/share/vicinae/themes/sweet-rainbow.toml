# Sweet-Rainbow — deep purple base with pink rainbow accents
# Matches the Sweet-transparent-toolbar Kvantum theme

[meta]
version = 1
name = "Sweet-Rainbow"
description = "Sweet-Rainbow — deep purple with pink accents, matching the Sweet Kvantum theme."
variant = "dark"
icon = "icons/catppuccin.png"

[colors.core]
background = "#171421"        # Sweet dark purple
foreground = "#F8F8F2"        # White text
secondary_background = "#1B1B2F"  # Deeper purple
border = "#2D2D44"            # Subtle purple-grey
accent = "#FF79C6"            # Sweet pink

[colors.accents]
blue = "#8BE9FD"
green = "#50FA7B"
magenta = "#FF79C6"
orange = "#FFB86C"
purple = "#BD93F9"
red = "#FF5555"
yellow = "#F1FA8C"
cyan = "#8BE9FD"

[colors.list.item.selection]
background = "#1E1A30"
secondary_background = "#2D2844"
